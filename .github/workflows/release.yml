name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libevdev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: nexdesk-linux-x86_64
          path: target/release/nexdesk

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build (aarch64)
        run: cargo build --release

      - name: Rename aarch64 binary
        run: cp target/release/nexdesk nexdesk-macos-aarch64

      - name: Build (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Rename x86_64 binary
        run: cp target/x86_64-apple-darwin/release/nexdesk nexdesk-macos-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: nexdesk-macos-aarch64
          path: nexdesk-macos-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: nexdesk-macos-x86_64
          path: nexdesk-macos-x86_64

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare binaries
        run: |
          mv artifacts/nexdesk-linux-x86_64/nexdesk nexdesk-linux-x86_64
          mv artifacts/nexdesk-macos-aarch64/nexdesk-macos-aarch64 nexdesk-macos-aarch64
          mv artifacts/nexdesk-macos-x86_64/nexdesk-macos-x86_64 nexdesk-macos-x86_64
          chmod +x nexdesk-*

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            nexdesk-linux-x86_64
            nexdesk-macos-aarch64
            nexdesk-macos-x86_64
