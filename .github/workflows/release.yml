name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libevdev-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v7
        with:
          name: nexdesk-linux-x86_64
          path: target/release/nexdesk

  build-macos:
    runs-on: macos-latest
    environment: CI
    steps:
      - uses: actions/checkout@v7

      - name: Setup code signing
        id: signing
        uses: ./.github/actions/setup-macos-signing
        with:
          p12-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}

      - name: Decode notary API key
        run: |
          echo "${{ secrets.APPLE_NOTARY_KEY }}" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build (aarch64)
        run: cargo build --release

      - name: Sign and notarize (aarch64)
        run: |
          cp target/release/nexdesk nexdesk-macos-aarch64

          codesign --force --sign "${{ steps.signing.outputs.signing-identity }}" \
            --options runtime --timestamp \
            --entitlements entitlements.plist \
            nexdesk-macos-aarch64

          ditto -c -k nexdesk-macos-aarch64 nexdesk-macos-aarch64.zip

          xcrun notarytool submit nexdesk-macos-aarch64.zip \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "${{ secrets.APPLE_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARY_ISSUER_ID }}" \
            --wait

      - name: Build (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Sign and notarize (x86_64)
        run: |
          cp target/x86_64-apple-darwin/release/nexdesk nexdesk-macos-x86_64

          codesign --force --sign "${{ steps.signing.outputs.signing-identity }}" \
            --options runtime --timestamp \
            --entitlements entitlements.plist \
            nexdesk-macos-x86_64

          ditto -c -k nexdesk-macos-x86_64 nexdesk-macos-x86_64.zip

          xcrun notarytool submit nexdesk-macos-x86_64.zip \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "${{ secrets.APPLE_NOTARY_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_NOTARY_ISSUER_ID }}" \
            --wait

      - uses: actions/upload-artifact@v7
        with:
          name: nexdesk-macos-aarch64
          path: nexdesk-macos-aarch64

      - uses: actions/upload-artifact@v7
        with:
          name: nexdesk-macos-x86_64
          path: nexdesk-macos-x86_64

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare binaries
        run: |
          mv artifacts/nexdesk-linux-x86_64/nexdesk nexdesk-linux-x86_64
          mv artifacts/nexdesk-macos-aarch64/nexdesk-macos-aarch64 nexdesk-macos-aarch64
          mv artifacts/nexdesk-macos-x86_64/nexdesk-macos-x86_64 nexdesk-macos-x86_64
          chmod +x nexdesk-*

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            nexdesk-linux-x86_64
            nexdesk-macos-aarch64
            nexdesk-macos-x86_64
